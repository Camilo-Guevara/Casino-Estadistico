name: Comprobar demo publicada

on:
  workflow_dispatch:
  push:
    branches: [main, "test/live-streamlit-check"]
    paths:
      - "scripts/smoke_live.py"
      - ".github/workflows/live-smoke.yml"
      - "app.py"
      - "diagnostics.py"
  pull_request:
    branches: [main]
    paths:
      - "scripts/smoke_live.py"
      - ".github/workflows/live-smoke.yml"
      - "app.py"
      - "diagnostics.py"

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      APP_URL: https://casino-estadistico-ubpy8lsfkqbb8yh6teansn.streamlit.app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegador de pruebas
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Comprobar app publicada y generar capturas
        run: python scripts/smoke_live.py
      - name: Conservar capturas incluso si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-casino-estadistico
          path: artifacts/live-smoke/
          if-no-files-found: warn
